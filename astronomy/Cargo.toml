[package]
name = "astronomy"
version = "0.1.0"
edition = "2024"

[dependencies]
# --- Abhängigkeiten für das Modul 'dates' ---
chrono = "0.4"
# --- Abhängigkeiten für das Untermodul 'dates::astrology' ---
chrono-tz = "0.10"  # Ermöglicht IANA-Zeitzonen-Datenbanken (z. B. "Europe/Vienna")
# --- Abhängigkeiten für das Untermodul 'dates::astronomy' ---
vsop87 = "3.0"     # Berechnet mathematisch exakte Planeten- und Sonnenpositionen

