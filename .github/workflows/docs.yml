# 01. Define workflow name
name: Deploy Documentation

# 02. Trigger workflow on push to main branch
on:
  push:
    branches: [ "main" ]

# 03. Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation with Cargo
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Create redirect index.html
        run: |
                  echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>SciRust Documentation</title><style>body{font-family:sans-serif;margin:40px;}ul{line-height:1.6;}</style></head><body>' > target/doc/index.html
                  echo '<h1>SciRust Documentation Workspace</h1><ul>' >> target/doc/index.html
                  for d in target/doc/*/; do
                    dir_name=$(basename "$d")
                    if [ "$dir_name" != "static.files" ]; then
                      echo "<li><a href=\"$dir_name/index.html\">$dir_name</a></li>" >> target/doc/index.html
                    fi
                  done
                  echo '</ul></body></html>' >> target/doc/index.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4