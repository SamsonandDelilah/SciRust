[package]
name = "core_io"
version = "0.1.0"
edition = "2024"

[features]
default = []
json = ["dep:serde_json"]
toml = ["dep:toml"]
yaml = ["dep:serde_yaml"]
csv = ["dep:csv"]
pdf = [] # if special special for generating reports
media = [] # Für Bild-/Videobuffer (JPG, PNG, AVI)


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
serde_yaml = { version = "0.9", optional = true }
csv = { version = "1.3", optional = true }